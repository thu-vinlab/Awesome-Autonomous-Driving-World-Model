name: Link Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Generated catalog links preserve upstream history and are audited separately.
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,429
            --exclude-loopback
            --exclude '^https://doi\.org/10\.36227/techrxiv\.'
            --max-retries 3
            --retry-wait-time 2
            README.md
            CONTRIBUTING.md
          fail: true
